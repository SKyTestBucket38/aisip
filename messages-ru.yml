      usrinfo_status: "СТАТУС: %var0%"
      usrinfo_ip: "IP: %var0%"
      usrinfo_uuid: "UNIQUE ID: %var0%"
      usrinfo_group: "ГРУППА: %var0%"
      unknown: "Неизвестно"
