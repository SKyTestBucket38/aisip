    desc: "Изменяет группу по умолчанию. #64FF00"
    usage: "Пример: /defgroup <группа>"
    messages:
      defgroup_successfully: "§8(§aАвто-донат§8)§f Группа по умолчанию успешно изменена на %var0%."
