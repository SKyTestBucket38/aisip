  setuperm: 
    desc: "Добавляет разрешение пользователю. #64FF00"
    usage: "Пример: /setuperm <игрок> <разрешение> [мир]"
    messages:
      level_not_exist: "§8(§aАвто-донат§8)§f Мир %var0% не существует."
      uperm_added_successfully: "§8(§aАвто-донат§8)§f Разрешение %var0% успешно добавлено игроку %var1%."
  unsetgperm: 
    desc: "Отбирает разрешение у группы. #64FF00"
    usage: "Пример: /unsetgperm <группа> <разрешение> [мир]"
    messages:
      gperm_removed_successfully: "§8(§aАвто-донат§8)§f Разрешение %var0% успешно отобрано у группы."
      group_not_exist: "§8(§aАвто-донат§8)§f Группа %var0% не существует."
      level_not_exist: "§8(§aАвто-донат§8)§f Мир %var0% не существует."
  unsetuperm: 
    desc: "Отбирает разрешение у игрока. #64FF00"
    usage: "Пример: /unsetuperm <игрок> <разрешение> [мир]"
    messages: 
      level_not_exist: "§8(§aАвто-донат§8)§f Мир %var0% не существует."
      uperm_removed_successfully: "§8(§aАвто-донат§8)§f Разрешение  %var0% успешно отобрано у игрока %var1%."
  usrinfo: 
    desc: "Показывает информацию об игроке. #64FF00"
    usage: "Пример: /usrinfo <игрок> [мир]"
    messages:
      level_not_exist: "Мир %var0% не существует."
      status_online: "ОНЛАЙН!"
      status_offline: "НЕ В ИГРЕ..."
      usrinfo_header: "<--- Информация об игроке %var0% --->"
