messages-version: "1.2.0"
language: "ru"
cmds:
  addgroup:
    desc: "Добавляет новую группу в список групп. #64FF00"
    usage: "Пример: /addgroup <группа>"
    messages:
      group_added_successfully: "§8(§aАвто-донат§8)§f  Группа %var0% успешно создана."
